<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Search & Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Product Store</h1>

    <div class="filter-container">
      <input type="text" id="search-input" placeholder="Search products by title...">
      
      <div class="category-buttons" id="category-buttons">
        <button class="btn active" data-category="all">All</button>
        <button class="btn" data-category="beauty">Beauty</button>
        <button class="btn" data-category="fragrances">Fragrances</button>
        <button class="btn" data-category="furniture">Furniture</button>
        <button class="btn" data-category="groceries">Groceries</button>
      </div>
    </div>

    <div id="product-list" class="product-grid">
      <p class="loading">Loading products...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
