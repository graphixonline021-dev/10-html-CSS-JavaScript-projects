<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Life Timer</h1>
    
    <div id="initial-wrapper">
      <h2>Enter Your Date of Birth</h2>
      <input type="datetime-local" id="dob-input">
      <button id="add-btn">Setting</button>
    </div>

    <div id="timer-wrapper" class="hidden">
      <h2>How Much Time You Have Lived</h2>
      <div class="timer-container">
        <div class="time-box"><span id="years">00</span><h3>Years</h3></div>
        <div class="time-box"><span id="months">00</span><h3>Months</h3></div>
        <div class="time-box"><span id="days">00</span><h3>Days</h3></div>
        <div class="time-box"><span id="hours">00</span><h3>Hours</h3></div>
        <div class="time-box"><span id="minutes">00</span><h3>Minutes</h3></div>
        <div class="time-box"><span id="seconds">00</span><h3>Seconds</h3></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
