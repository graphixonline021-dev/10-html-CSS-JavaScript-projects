<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Password Generator</h2>

    <div class="result-container">
      <input type="text" id="result" readonly placeholder="Click Generate">
      <button id="copy-btn">Copy</button>
    </div>

    <div class="options">
      <div class="option">
        <label for="length">Password Length</label>
        <input type="number" id="length" min="4" max="30" value="12">
      </div>

      <div class="option">
        <label for="uppercase">Include Uppercase (A-Z)</label>
        <input type="checkbox" id="uppercase" checked>
      </div>

      <div class="option">
        <label for="lowercase">Include Lowercase (a-z)</label>
        <input type="checkbox" id="lowercase" checked>
      </div>

      <div class="option">
        <label for="numbers">Include Numbers (0-9)</label>
        <input type="checkbox" id="numbers" checked>
      </div>

      <div class="option">
        <label for="symbols">Include Symbols (!@#$)</label>
        <input type="checkbox" id="symbols" checked>
      </div>
    </div>

    <button id="generate-btn" class="btn">Generate Password</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
